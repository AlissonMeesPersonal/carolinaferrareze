name: Gerar imagens da Carolina
on:
  push:
    branches: [main]
    paths:
      - public/images/carolina-editorial.avif
      - .github/workflows/carolina-photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar processamento de imagem
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow pillow-avif-plugin
      - name: Extrair retratos mantendo proporção
        run: |
          python3 - <<'PY'
          from PIL import Image
          import pillow_avif
          from pathlib import Path
          source=Image.open("public/images/carolina-editorial.avif").convert("RGB")
          assert source.size==(720,1080), f"Unexpected asset dimensions: {source.size}"
          names=[("carolina-hero.webp",0,0),("carolina-sobre.webp",360,0),
                 ("carolina-mentorias.webp",0,540),("carolina-perfil.webp",360,540)]
          for name,x,y in names:
              source.crop((x,y,x+360,y+540)).save(Path("public/images")/name, "WEBP", quality=87, method=6)
          PY
      - name: Versionar arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/carolina-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: extract four Carolina portraits for responsive site"
            git push
          fi
