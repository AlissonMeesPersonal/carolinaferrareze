<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title5 desc5">
<title id="title5">Depoimento 5</title><desc id="desc5">Amei essa experiência, me trouxe uma sensação leve agora... com certeza quero marcar mais sessões!</desc>
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4F1E8"/><stop offset="1" stop-color="#E7D9C7"/></linearGradient></defs>
<rect width="760" height="560" fill="url(#paper)"/>
<rect x="26" y="26" width="708" height="508" rx="2" fill="none" stroke="#B79A74" stroke-opacity=".65" stroke-width="1.5"/>
<text x="380" y="80" text-anchor="middle" fill="#9C752F" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4">DEPOIMENTO 05</text>
<path d="M292 106 H468" stroke="#B79A74" stroke-width="1"/>
<text x="380" y="189" text-anchor="middle" font-family="Georgia,serif" font-size="99" fill="#B79A74" opacity=".85">“</text>
<text x="380" y="230" font-family="Georgia,serif" font-size="37" text-anchor="middle" fill="#321D14"><tspan x="380" dy="0">Amei essa experiência,</tspan><tspan x="380" dy="53">me trouxe uma sensação</tspan><tspan x="380" dy="53">leve agora...</tspan><tspan x="380" dy="53">com certeza quero marcar</tspan><tspan x="380" dy="53">mais sessões!</tspan></text>
<path d="M306 475 H454" stroke="#B79A74" stroke-width="1"/>
<text x="380" y="509" text-anchor="middle" fill="#705D50" font-family="Arial,sans-serif" letter-spacing="1.2" font-size="15">TRECHO DE MENSAGEM • IDENTIDADE PRESERVADA</text>
</svg>